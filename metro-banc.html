<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Métro A, banc d'essai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1d2236;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:Grandstander,system-ui,sans-serif}
canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
.zone{position:absolute;display:flex;gap:10px;align-items:center}
.bl{left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));flex-direction:column}
.br{right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));flex-direction:column}
.bc{left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));gap:28px}
.btn{pointer-events:auto;position:relative;width:88px;height:88px;border:none;border-radius:50%;padding:0;display:grid;place-items:center;cursor:pointer;
  box-shadow:0 6px 0 rgba(0,0,0,.28),0 10px 18px rgba(0,0,0,.25);transition:opacity .25s,filter .25s;font:inherit;outline:none}
.btn svg{width:72%;height:72%;pointer-events:none}
.btn:active{translate:0 4px;box-shadow:0 2px 0 rgba(0,0,0,.28),0 4px 10px rgba(0,0,0,.25)}
.btn.xl{width:124px;height:124px}
.btn.cran{width:96px;height:80px;border-radius:22px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.btn.cran.on{box-shadow:inset 0 0 0 7px #fff,0 0 18px rgba(255,255,255,.6)}
.btn.off{opacity:.3;filter:grayscale(.8)}
.btn.glow::after{content:'';position:absolute;inset:-9px;border-radius:inherit;border:5px solid #fff3a0;animation:glow 1.3s ease-in-out infinite;pointer-events:none}
.btn.strong::after{inset:-14px;border-width:9px;animation-duration:.55s}
.btn.strong{animation:bob .55s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.3;transform:scale(.95)}50%{opacity:1;transform:scale(1.07)}}
@keyframes bob{50%{scale:1.1}}
.lever{pointer-events:auto;display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:30px;background:#3a4062;box-shadow:0 6px 16px rgba(0,0,0,.35)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<script>
'use strict';
/* ================= Données ================= */
// Un tronçon = une interstation. Distances en mètres depuis le départ (avant de la rame).
const TRAJET = [{
  de: 'Flachet', vers: 'Gratte-Ciel', ligne: 'A', direction: 'Perrache',
  quaiDepart: [-60, 6],        // zone éclairée de la station de départ
  quaiDebut: 176,              // début du quai d'arrivée
  repere: 220,                 // point d'arrêt (avant de la rame)
  evenements: {
    croisement: 26,            // rame d'en face (vers 5 s)
    courbe: [50, 92],          // courbe douce (vers 9 s)
    signal: { rouge: 96, arret: 140, attente: 2.2 }, // vers 12 s
    gens: [{ d: 196, X: 3.6, p: 'mamie2' }, { d: 214, X: 4.6, p: 'enfant' }, { d: 236, X: 3.2, p: 'monsieur2' }]
  }
}];
const PHYS = { vmax: 16, acc: 4, dec: 4, creep: 2.5, drag: 0.15 };
const FONT = 'Grandstander, "Comic Sans MS", system-ui, sans-serif';

const PERS = {
  ulysse:  { h: 46, skin: '#f7d6bd', hair: '#f3cf5a', style: 'court', eyes: '#2f78d6', top: '#2f4f86', legs: '#33415f', cape: '#e0413a', cap: 'orange' },
  sacha:   { h: 38, skin: '#f7d6bd', hair: '#f5d86e', style: 'long', eyes: '#3a7fd0', top: '#9fd2ef', legs: '#53668c', cape: '#f6c531' },
  papa:    { h: 76, skin: '#c08a5c', hair: '#3a281d', style: 'court', top: '#6d9277', legs: '#3c3f4c', beard: true, thin: true, bibou: true },
  maman:   { h: 70, skin: '#f3d0b5', hair: '#8a5530', style: 'milong', eyes: '#3a7fd0', top: '#e88aa2', legs: '#4a5376' },
  poussette:{ h: 70, skin: '#8d5a3b', hair: '#1f1b1a', style: 'chignon', top: '#f2b24b', legs: '#5a4a7a', prop: 'poussette' },
  valise:  { h: 76, skin: '#f0c9a8', hair: '#9b9b9b', style: 'court', top: '#4f6fa8', legs: '#2f3340', prop: 'valise' },
  etudiant:{ h: 72, skin: '#e3b088', hair: '#262626', style: 'boucle', top: '#8e6cc9', legs: '#30405a', prop: 'casque' },
  mamie:   { h: 64, skin: '#f3d6c1', hair: '#e8e8e8', style: 'chignon', top: '#b56f8f', legs: '#6a5a6a', prop: 'canne' },
  enfant:  { h: 44, skin: '#a86b45', hair: '#2a1c14', style: 'boucle', top: '#ff8a5c', legs: '#3d6b8a' },
  dame:    { h: 70, skin: '#f5d5bd', hair: '#c4552f', style: 'long', top: '#3fb5a3', legs: '#3a3f55', prop: 'sac' },
  monsieur:{ h: 74, skin: '#6b4630', hair: '#141414', style: 'court', top: '#f0d24b', legs: '#34405a', beard: true },
  mamie2:  { h: 64, skin: '#f0d0b8', hair: '#d9d9d9', style: 'chignon', top: '#7aa36b', legs: '#555' },
  monsieur2:{ h: 74, skin: '#e9c3a0', hair: '#5a3b22', style: 'court', top: '#c76b5b', legs: '#333a4a' }
};

/* ================= Canvas ================= */
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), ui = document.getElementById('ui');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
}
window.addEventListener('resize', resize); resize();

/* ================= État ================= */
const S = {
  scene: 'accueil', t: 0, timers: [], level: 'tortue', hint: null, hintAt: 0, lastInput: 0,
  fade: null, sub: null, btns: {},
  // cabine
  pos: 0, v: 0, cmd: 'roule', sig: 'vert0', arrived: false, cross: null, crossDone: false, ohDone: false, braking: false,
  miaou: false,
  // quais
  actors: [], doors: 1, doorTarget: 1, lean: false, ready: false, coucou: false, stampDone: false
};
window.BANC = { S, TRAJET, PHYS };
const TR = () => TRAJET[0];
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const now = () => performance.now();
function after(sec, fn) { S.timers.push({ t: S.t + sec, fn }); }

/* ================= Audio ================= */
const A = { ctx: null };
function initAudio() {
  if (A.ctx) { if (A.ctx.state === 'suspended') A.ctx.resume(); return; }
  const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
  try {
    const c = A.ctx = new C();
    A.master = c.createGain(); A.master.gain.value = 0.8; A.master.connect(c.destination);
    const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    A.noise = buf;
    const mk = (type, freq, q) => {
      const s = c.createBufferSource(); s.buffer = buf; s.loop = true;
      const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
      const g = c.createGain(); g.gain.value = 0;
      s.connect(f); f.connect(g); g.connect(A.master); s.start();
      return { f, g };
    };
    A.roll = mk('lowpass', 200, 0.7);
    A.brake = mk('bandpass', 3200, 6);
    const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = 900;
    A.whG = c.createGain(); A.whG.gain.value = 0; o.connect(A.whG); A.whG.connect(A.master); o.start(); A.wh = o;
  } catch (e) { A.ctx = null; }
  // Réveille la synthèse vocale pendant le geste (iOS)
  if ('speechSynthesis' in window) { try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {} }
}
function setRolling(v, braking) {
  if (!A.ctx) return; const t = A.ctx.currentTime, k = v / PHYS.vmax;
  A.roll.g.gain.setTargetAtTime(v > 0.05 ? 0.05 + k * 0.22 : 0, t, 0.15);
  A.roll.f.frequency.setTargetAtTime(160 + k * 520, t, 0.2);
  A.whG.gain.setTargetAtTime(k * 0.012, t, 0.2);
  A.wh.frequency.setTargetAtTime(500 + k * 900, t, 0.2);
  A.brake.g.gain.setTargetAtTime(braking && v > 0.3 ? 0.05 + k * 0.05 : 0, t, 0.08);
}
function tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slide = 0) {
  if (!A.ctx) return; const c = A.ctx, t = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(A.master); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, freq, q, vol, delay = 0, sweep = 0, attack = 0.01) {
  if (!A.ctx) return; const c = A.ctx, t = c.currentTime + delay;
  const s = c.createBufferSource(); s.buffer = A.noise;
  const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
  if (sweep) f.frequency.exponentialRampToValueAtTime(sweep, t + dur);
  const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(A.master); s.start(t); s.stop(t + dur + 0.05);
}
const SND = {
  clac() { noise(0.05, 1800, 1.5, 0.6); tone(150, 0.07, 'square', 0.15); },
  sonnerie() { tone(988, 0.34, 'triangle', 0.35); tone(784, 0.55, 'triangle', 0.35, 0.36); },
  klaxon() { tone(330, 0.5, 'sawtooth', 0.09); tone(415, 0.5, 'sawtooth', 0.09); tone(660, 0.5, 'square', 0.03); },
  souffle() { noise(1.8, 300, 0.7, 0.6, 0, 2600, 0.6); },
  pschitt() { noise(0.6, 4000, 0.8, 0.2, 0, 2000, 0.02); },
  ding() { tone(1320, 0.3, 'sine', 0.25); tone(1760, 0.4, 'sine', 0.2, 0.15); },
  tampon() { tone(110, 0.35, 'sine', 0.7, 0, 45); noise(0.12, 700, 1, 0.5); },
  joie() { tone(660, 0.12, 'triangle', 0.2); tone(880, 0.12, 'triangle', 0.2, 0.12); tone(1100, 0.2, 'triangle', 0.2, 0.24); },
  pas() { tone(220, 0.06, 'sine', 0.08); }
};

/* ================= Voix ================= */
let frVoice = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  frVoice = vs.find(v => v.lang === 'fr-FR') || vs.find(v => (v.lang || '').toLowerCase().startsWith('fr')) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
const VOIX = { voix: [1, 0.95], papa: [0.75, 0.95], maman: [1.15, 0.95], sacha: [1.7, 1.05], enfant: [1.6, 1.05], ulysse: [1.35, 1] };
function say(text, who = 'voix') {
  S.sub = { text, until: now() + Math.max(1800, text.length * 90) };
  if (!('speechSynthesis' in window)) return;
  try {
    const u = new SpeechSynthesisUtterance(text); u.lang = 'fr-FR'; if (frVoice) u.voice = frVoice;
    const p = VOIX[who] || VOIX.voix; u.pitch = p[0]; u.rate = p[1];
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ================= Icônes ================= */
const ICON = {
  tortue: '<svg viewBox="0 0 100 100"><ellipse cx="78" cy="58" rx="12" ry="10" fill="#8fd16a"/><circle cx="82" cy="55" r="2.6" fill="#223"/><rect x="22" y="62" width="12" height="16" rx="6" fill="#8fd16a"/><rect x="58" y="62" width="12" height="16" rx="6" fill="#8fd16a"/><path d="M14 66 Q16 30 46 28 Q74 30 76 66 Z" fill="#3f9b4a"/><path d="M30 64 L36 44 L54 40 L64 56 M36 44 L46 30 M54 40 L60 31" stroke="#2c7236" stroke-width="3" fill="none"/><rect x="10" y="62" width="70" height="6" rx="3" fill="#2c7236"/></svg>',
  lievre: '<svg viewBox="0 0 100 100"><ellipse cx="44" cy="62" rx="26" ry="17" fill="#c99a6b"/><circle cx="70" cy="48" r="13" fill="#c99a6b"/><ellipse cx="66" cy="22" rx="5" ry="17" transform="rotate(-12 66 22)" fill="#c99a6b"/><ellipse cx="77" cy="22" rx="5" ry="17" transform="rotate(10 77 22)" fill="#c99a6b"/><ellipse cx="66" cy="22" rx="2.2" ry="11" transform="rotate(-12 66 22)" fill="#f2b8b0"/><circle cx="74" cy="46" r="2.6" fill="#223"/><circle cx="82" cy="51" r="2.2" fill="#e87"/><circle cx="18" cy="56" r="6" fill="#fff"/><rect x="26" y="70" width="22" height="9" rx="4.5" fill="#b0855a"/><rect x="52" y="72" width="16" height="8" rx="4" fill="#b0855a"/></svg>',
  fermer: '<svg viewBox="0 0 100 100"><rect x="14" y="16" width="30" height="68" rx="6" fill="#fff"/><rect x="56" y="16" width="30" height="68" rx="6" fill="#fff"/><rect x="19" y="24" width="20" height="24" rx="4" fill="#cfe7f7"/><rect x="61" y="24" width="20" height="24" rx="4" fill="#cfe7f7"/><path d="M4 66 L16 60 L16 72 Z M96 66 L84 60 L84 72 Z" fill="#fff"/></svg>',
  ouvrir: '<svg viewBox="0 0 100 100"><rect x="6" y="16" width="26" height="68" rx="6" fill="#fff"/><rect x="68" y="16" width="26" height="68" rx="6" fill="#fff"/><rect x="11" y="24" width="16" height="24" rx="4" fill="#cfe7f7"/><rect x="73" y="24" width="16" height="24" rx="4" fill="#cfe7f7"/><path d="M38 66 L50 58 L50 74 Z M62 66 L50 58 L50 74 Z" fill="#fff" transform="translate(0 0)"/><path d="M36 66 L46 60 L46 72 Z" fill="none"/></svg>',
  avance: '<svg viewBox="0 0 100 100"><path d="M50 14 L84 54 L62 54 L62 86 L38 86 L38 54 L16 54 Z" fill="#fff"/></svg>',
  roule: '<svg viewBox="0 0 100 100"><rect x="16" y="40" width="68" height="20" rx="10" fill="#fff"/></svg>',
  frein: '<svg viewBox="0 0 100 100"><path d="M35 12 H65 L88 35 V65 L65 88 H35 L12 65 V35 Z" fill="#fff"/><path d="M38 22 H62 L78 38 V62 L62 78 H38 L22 62 V38 Z" fill="#e2453c"/><rect x="30" y="44" width="40" height="12" rx="6" fill="#fff"/></svg>',
  micro: '<svg viewBox="0 0 100 100"><rect x="36" y="10" width="28" height="48" rx="14" fill="#fff"/><path d="M24 46 Q24 72 50 72 Q76 72 76 46" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/><rect x="46" y="72" width="8" height="14" fill="#fff"/><rect x="32" y="84" width="36" height="7" rx="3.5" fill="#fff"/></svg>',
  klaxon: '<svg viewBox="0 0 100 100"><path d="M14 40 H30 L62 18 V82 L30 60 H14 Z" fill="#6b4a12"/><path d="M72 34 Q82 50 72 66 M80 26 Q94 50 80 74" stroke="#6b4a12" stroke-width="6" fill="none" stroke-linecap="round"/></svg>',
  encore: '<svg viewBox="0 0 100 100" style="position:absolute;right:-6px;top:-6px;width:42px;height:42px"><circle cx="50" cy="50" r="46" fill="#fff"/><path d="M50 22 A28 28 0 1 1 24 42" stroke="#3a4062" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M12 30 L30 26 L26 46 Z" fill="#3a4062"/></svg>'
};

/* ================= Interface DOM ================= */
function buildUI(zones) {
  ui.innerHTML = ''; S.btns = {};
  for (const z of zones) {
    const zone = document.createElement('div'); zone.className = 'zone ' + z.zone;
    let host = zone;
    if (z.lever) { host = document.createElement('div'); host.className = 'lever'; zone.appendChild(host); }
    for (const b of z.btns) {
      const el = document.createElement('button');
      el.className = 'btn ' + (b.cls || ''); el.style.background = b.bg; el.innerHTML = b.icon;
      el.setAttribute('aria-label', b.label); el.dataset.id = b.id;
      el.addEventListener('pointerdown', e => { e.preventDefault(); press(b.id); });
      el.addEventListener('contextmenu', e => e.preventDefault());
      host.appendChild(el); S.btns[b.id] = el;
    }
    ui.appendChild(zone);
  }
  applyHint();
}
function setHint(id) { if (S.hint === id) return; S.hint = id; S.hintAt = now(); applyHint(); }
function applyHint() {
  for (const id in S.btns) S.btns[id].classList.toggle('glow', id === S.hint);
  for (const id in S.btns) S.btns[id].classList.remove('strong');
}
function setOff(id, off) { const b = S.btns[id]; if (b) b.classList.toggle('off', off); }

let handlers = {};
function press(id) {
  S.lastInput = now(); initAudio();
  if (S.btns[id]) S.btns[id].classList.remove('strong');
  if (S.fade) return;
  const h = handlers[id]; if (h) h();
}

/* ================= Transitions ================= */
function go(start) { if (S.fade) return; S.fade = { a: 0, dir: 1, cb: start }; }
function enter(scene) {
  S.scene = scene; S.t = 0; S.timers = []; S.hint = null; S.sub = null; handlers = {};
}

/* ================= Scène : accueil ================= */
function startAccueil() {
  enter('accueil');
  buildUI([{ zone: 'bc', btns: [
    { id: 'tortue', icon: ICON.tortue, bg: '#dff3d2', cls: 'xl', label: 'Tortue' },
    { id: 'lievre', icon: ICON.lievre, bg: '#f7e6cf', cls: 'xl', label: 'Lièvre' }] }]);
  handlers.tortue = () => { S.level = 'tortue'; go(startQuaiDepart); };
  handlers.lievre = () => { S.level = 'lievre'; go(startQuaiDepart); };
}

/* ================= Quais : acteurs ================= */
// Coordonnées : x en unités u, relatif à l'avant de la rame (négatif = vers l'arrière). dy : 0 = plancher, >0 = sur le quai devant.
const DOOR_A = -90, DOOR_B = -230, CAB = -18;
function actor(id, x, dy, inside, lift = 0) {
  return { id, p: PERS[id], x, dy, inside, lift, path: [], spd: 70, walking: false, wave: false, jump: 0, hidden: false, t: Math.random() * 5 };
}
function entrer(a, door, spot, lift = 0) {
  a.path = [{ x: door, dy: 0 }, { x: door, dy: 0, inside: true }, { x: spot, dy: 0, lift }];
}
function sortir(a, door, dest, dyEnd = 22) {
  a.path = [{ x: door, dy: 0, lift: 0 }, { x: door, dy: 0, inside: false }, { x: door - 8, dy: dyEnd }, { x: dest, dy: dyEnd }];
}
function updActors(dt) {
  for (const a of S.actors) {
    a.t += dt; if (a.jump > 0) a.jump = Math.max(0, a.jump - dt);
    if (!a.path.length) { a.walking = false; continue; }
    const w = a.path[0], dx = w.x - a.x, dd = w.dy - a.dy, dist = Math.hypot(dx, dd), step = a.spd * dt;
    if (dist <= step) {
      a.x = w.x; a.dy = w.dy;
      if (w.inside !== undefined) a.inside = w.inside;
      if (w.lift !== undefined) a.lift = w.lift;
      a.path.shift();
    } else { a.x += dx / dist * step; a.dy += dd / dist * step; }
    a.walking = a.path.length > 0 && dist > 0.5;
  }
  S.doors += clamp(S.doorTarget - S.doors, -dt * 1.3, dt * 1.3);
}
const A_ = id => S.actors.find(a => a.id === id);

/* ================= Scène : quai Flachet ================= */
function startQuaiDepart() {
  enter('quaiDepart');
  S.doors = 1; S.doorTarget = 1; S.lean = false; S.ready = false; S.miaou = false;
  S.actors = [
    actor('mamie', -267, 0, true), actor('poussette', -195, 0, true), actor('valise', -150, 0, true), actor('etudiant', -122, 0, true),
    actor('ulysse', -170, 24, false), actor('sacha', -200, 28, false), actor('maman', -225, 24, false), actor('papa', -255, 26, false)
  ];
  const u = A_('ulysse'), s = A_('sacha'), m = A_('maman'), p = A_('papa');
  entrer(u, DOOR_A, CAB, 22); u.path.splice(2, 0, { x: -40, dy: 0 });
  entrer(s, DOOR_A, -46, 32); entrer(m, DOOR_A, -100); entrer(p, DOOR_A, -72);
  s.delay = 0.5; m.delay = 0.9; p.delay = 1.4;
  for (const a of [s, m, p]) { const path = a.path; a.path = []; after(a.delay, () => { a.path = path; }); }
  buildUI([{ zone: 'bc', btns: [{ id: 'fermer', icon: ICON.fermer, bg: '#e2453c', cls: 'xl off', label: 'Fermer les portes' }] }]);
  after(5.2, () => { say("C'est parti, conducteur !", 'papa'); });
  after(6.4, () => { S.ready = true; setOff('fermer', false); setHint('fermer'); });
  handlers.fermer = () => {
    if (!S.ready) return; S.ready = false; setHint(null); setOff('fermer', true);
    SND.sonnerie();
    after(1.0, () => { S.doorTarget = 0; SND.pschitt(); });
    after(2.6, () => go(startCabine));
  };
}

/* ================= Scène : cabine ================= */
function startCabine() {
  enter('cabine');
  Object.assign(S, { pos: 0, v: 0, cmd: 'roule', sig: 'vert0', arrived: false, cross: null, crossDone: false, ohDone: false, braking: false });
  const t = S.level === 'tortue';

/* ================= Dessin : cabine ================= */
function curveAt(pos) {

}

}
function drawCabine() {

    const c = (col) => mix(col, FOG, fog);

    const q = (X0, Y0, X1, Y1, col, plane) => {
      let pts;

      else pts = [P(X0, Y0, z0), P(X1, Y0, z0), P(X1, Y0, z1), P(X0, Y0, z1)];

      q(XL, 0, XL, TOP, par ? '#f1e8d4' : '#e9dfc9', 'x');
      q(XR, 1.0, XR, TOP, par ? '#f4ecda' : '#ebe1cc', 'x');
      q(XL, 0, 1.7, 0, '#6d6678', 'y');
      q(1.7, 1.0, XR, 1.0, par ? '#cfc7ba' : '#c7bfb1', 'y');
      q(1.7, 0, 1.7, 1.0, '#a59d90', 'x');

    } else {

      q(XL, 0, XL, TOP, par ? '#4a4a5e' : '#424256', 'x');
      q(XR, 0, XR, TOP, par ? '#4d4d62' : '#45455a', 'x');
      q(XL, 0, XR, 0, '#2c2a36', 'y');

      circle(tx, ty, r, '#ffd23f'); circle(tx, ty, r * 0.45, '#fff7c8');

      const red = S.sig === 'rouge' || S.sig === 'attente', col = red ? '#ff3b30' : '#38e07b';
      const ly = red ? ty + 0.2 * s : ty + 0.58 * s;
      ctx.fillStyle = red ? 'rgba(255,60,48,.35)' : 'rgba(56,224,123,.35)'; ctx.beginPath(); ctx.arc(tx, ly, 0.6 * s, 0, Math.PI * 2); ctx.fill();
      circle(tx, ty + 0.2 * s, 0.17 * s, red ? col : '#3a1414'); circle(tx, ty + 0.58 * s, 0.17 * s, red ? '#123a20' : col);
  } }

      const fogk = clamp(a / 110, 0, 0.7);

      quad([P(XI, 2.0, a), P(XI, 3.0, a), P(XI, 3.0, zb), P(XI, 2.0, zb)], mix('#5d6b86', FOG, fogk));

function drawVitreArriere(vh) {

  ctx.fillStyle = '#fde9c8'; ctx.fillRect(-R * 0.27, -R * 0.45, R * 0.4, R * 0.08);
  ctx.restore();
  if (S.stampDone) for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 + S.t * 0.3, d = R * 1.25 + Math.sin(S.t * 3 + i) * 8; circle(W / 2 + Math.cos(a) * d, cy + Math.sin(a) * d, 5, ['#ffd23f', '#3dbb5c', '#4a8fd8', '#e2453c'][i % 4]); }
}

/* ================= Boucle ================= */
let last = now();
function frame() {
  const tn = now(); const dt = Math.min(0.05, (tn - last) / 1000); last = tn;
  if (S.fade) {
    S.fade.a += S.fade.dir * dt / 0.4;
    if (S.fade.dir > 0 && S.fade.a >= 1) { S.fade.a = 1; S.fade.dir = -1; const cb = S.fade.cb; cb(); }
    else if (S.fade.dir < 0 && S.fade.a <= 0) S.fade = null;
  }
  S.t += dt;
  for (const tm of S.timers.slice()) if (S.t >= tm.t) { S.timers.splice(S.timers.indexOf(tm), 1); tm.fn(); }
  if (S.scene === 'cabine') updCabine(dt); else setRolling(0, false);
  if (S.scene === 'quaiDepart' || S.scene === 'quaiArrivee') updActors(dt);
  // aide : si rien ne se passe pendant 8 s, la commande pulse plus fort
  if (S.hint && S.btns[S.hint]) S.btns[S.hint].classList.toggle('strong', tn - Math.max(S.hintAt, S.lastInput) > 8000);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (S.scene === 'accueil') drawAccueil();
  else if (S.scene === 'quaiDepart') { drawQuai('Flachet'); drawSub(14); }
  else if (S.scene === 'cabine') drawCabine();
  else if (S.scene === 'quaiArrivee') { drawQuai('Gratte-Ciel'); drawSub(14); }
  else if (S.scene === 'fin') drawFin();
  if (S.fade) { ctx.fillStyle = `rgba(10,12,24,${S.fade.a})`; ctx.fillRect(0, 0, W, H); }
  requestAnimationFrame(frame);
}

/* ================= Entrées ================= */
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); S.lastInput = now(); initAudio();
  if (!S.fade) quaiTap(e.clientX, e.clientY);
});
window.addEventListener('keydown', e => {
  S.lastInput = now(); initAudio();
  const k = e.key;
  if (S.scene === 'accueil') { if (k === 'ArrowLeft' || k === '1' || k === 't') press('tortue'); if (k === 'ArrowRight' || k === '2' || k === 'l') press('lievre'); }
  if (S.scene === 'fin') { if (k === 'ArrowLeft' || k === '1' || k === 't') press('encoreT'); if (k === 'ArrowRight' || k === '2' || k === 'l') press('encoreL'); }
  if (S.scene === 'cabine') {
    const order = ['frein', 'roule', 'avance'], i = order.indexOf(S.cmd);
    if (k === 'ArrowUp') { e.preventDefault(); press(order[Math.min(2, i + 1)]); }
    if (k === 'ArrowDown') { e.preventDefault(); press(order[Math.max(0, i - 1)]); }
    if (k === 'm' || k === 'M') press('micro');
  }
  if (k === 'k' || k === 'K') { if (S.btns.klaxon) press('klaxon'); }
  if (k === ' ' || k === 'Enter') { e.preventDefault(); if (S.hint) press(S.hint); else if (S.scene === 'accueil') press('tortue'); }
});

startAccueil();
requestAnimationFrame(frame);
</script>
